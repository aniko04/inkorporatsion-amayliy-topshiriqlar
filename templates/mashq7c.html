<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mashq 7 - Krossvord</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    {% comment %}
        Shriftlar bloklamasdan yuklanadi. CSS `@import` BO'LMASIN: u
        render-blocking, ya'ni Google Fonts sekinlashsa sahifadagi
        inline <script> lar ishga tushmay, test/krossvord qotib qoladi.
    {% endcomment %}
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
    </noscript>
    <link rel="stylesheet" href="/static/css/style.css?v=4">
    <link rel="stylesheet" href="/static/css/mashq6.css?v=2">
    {% comment %}
        Krossvordning butun ko'rinishi — /static/css/krossvord.css da
        (o'nta krossvord sahifasi uchun bitta joy). Ilgari har bir
        sahifa shu yerda ~90 qatorlik bir xil blokni olib yurardi.
        Fayl style.css va mashqN.css dan KEYIN ulanadi, shuning uchun
        bir xil aniqlikdagi qoidalarda ham ustun keladi.

        `?v=` — kesh buzg'unchi: statik fayllar hashlanmaydi, shuning
        uchun krossvord.css ni tahrirlaganda raqamni OSHIRING.
    {% endcomment %}
    <link rel="stylesheet" href="/static/css/krossvord.css?v=1">
    <style>
        /* Faqat shu krossvordga xos: to'rning o'lchami.
           Katak kengligini endi JOY belgilaydi (krossvord.css). */
        .crossword-grid { --kv-ustun: 19; --kv-qator: 17; }
    </style>
    <link rel="icon" href="/static/img/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" href="/static/img/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
</head>
<body class="t-rose">
    <a href="/multimediya" class="back-link">&larr; Orqaga</a>
    <h1 class="mashq-title">Krossvordni yeching!</h1>
    <div class="quiz-card mashq6-card mashq7c-card">
        <div class="main-layout">
            <div class="clues-col clues-left">
                <h3>Eniga &rarr;</h3>
                <div id="clues-h"></div>
            </div>
            <div class="crossword-center">
                <div class="crossword-grid" id="grid"></div>
                <div class="btn-area">
                    <button class="check-btn" id="check-btn" onclick="checkAnswers()">Tekshirish</button>
                    <button class="retry-btn" id="retry-btn" onclick="retry()">Qayta urinish</button>
                </div>
                <div class="result-msg" id="result"></div>
            </div>
            <div class="clues-col clues-right">
                <h3>Bo'yiga &darr;</h3>
                <div id="clues-v"></div>
            </div>
        </div>
    </div>
<script>
var ROWS=17, COLS=19;
var dir='h';
var focusedCell=null;

var answers={
'0-0':'Y','0-4':'M',
'1-0':'A','1-4':'U',
'2-0':'P','2-4':'R',
'3-0':'O','3-1':'R','3-2':'I','3-3':'G','3-4':'A','3-5':'M','3-6':'I','3-7':'S','3-8':'T',
'4-0':'N','4-4':'K',
'5-0':'I','5-4':'K','5-15':'M','5-17':'M',
'6-0':'Y','6-4':'A','6-14':'Y','6-15':'A','6-16':'P','6-17':'O','6-18':'N',
'7-0':'A','7-4':'B','7-5':'U','7-6':'K','7-7':'L','7-8':'A','7-9':'SH','7-11':'A','7-15':'N','7-17':'D',
'8-6':'L','8-11':'K','8-15':'T','8-17':'U',
'9-4':'B','9-6':'A','9-9':'O','9-10':'R','9-11':'I','9-12':'G','9-13':'A','9-14':'M','9-15':'I','9-17':'L',
'10-4':'U','10-6':'S','10-11':'R','10-13':'N','10-15':'Q','10-17':'L',
'11-4':'K','11-5':'U','11-6':'S','11-7':'U','11-8':'D','11-9':'A','11-10':'M','11-11':'A','11-13':'A','11-15':'I','11-17':'I',
'12-4':'L','12-6':'I','12-13':'N','12-15':'Y',
'13-4':'A','13-6':'K','13-13':'A',
'14-4':'SH','14-13':'V','14-14':'O','14-15':'D','14-16':'I','14-17':'Y',
'15-7':'Q','15-8':'A','15-9':'D','15-10':'I','15-11':'M','15-12':'G','15-13':'I',
'16-13':'Y'
};

var keyCells=new Set([
'0-4','1-4','2-4','3-4','4-4','5-4','6-4','7-4',
'9-4','10-4','11-4','12-4','13-4','14-4'
]);

var nums={
'0-0':[{n:'1',c:'#1b8a2f'}],
'3-0':[{n:'7',c:'#e53935'}],
'5-15':[{n:'5',c:'#7b2ff7'}],
'5-17':[{n:'6',c:'#1e88e5'}],
'6-14':[{n:'8',c:'#e6a817'}],
'7-4':[{n:'9',c:'#f97316'}],
'7-6':[{n:'2',c:'#1b8a2f'}],
'7-11':[{n:'4',c:'#e53935'}],
'9-9':[{n:'10',c:'#1e88e5'}],
'9-13':[{n:'3',c:'#e6a817'}],
'11-4':[{n:'11',c:'#7b2ff7'}],
'14-13':[{n:'12',c:'#f97316'}],
'15-7':[{n:'15',c:'#1b8a2f'}]
};

var hRanges=[[3,0,8],[6,14,18],[7,4,9],[9,9,15],[11,4,11],[14,13,17],[15,7,13]];
var vRanges=[[0,0,7],[4,0,7],[4,9,14],[6,7,13],[11,7,11],[13,9,16],[15,5,12],[17,5,11]];

var hSet=new Set(), vSet=new Set();
hRanges.forEach(function(w){ for(var c=w[1];c<=w[2];c++) hSet.add(w[0]+'-'+c); });
vRanges.forEach(function(w){ for(var r=w[1];r<=w[2];r++) vSet.add(r+'-'+w[0]); });

function has(r,c){ return (r+'-'+c) in answers; }
function getInp(r,c){ return document.querySelector('input[data-row="'+r+'"][data-col="'+c+'"]'); }

function autoDir(r,c){
    var k=r+'-'+c;
    var isH=hSet.has(k), isV=vSet.has(k);
    if(isH&&!isV) return 'h';
    if(isV&&!isH) return 'v';
    return dir;
}

function highlightWord(r,c){
    document.querySelectorAll('.cell input.hl').forEach(function(i){ i.classList.remove('hl'); });
    var i,w;
    if(dir==='h'){
        for(i=0;i<hRanges.length;i++){
            w=hRanges[i];
            if(w[0]===r && c>=w[1] && c<=w[2]){
                for(var nc=w[1];nc<=w[2];nc++){ var el=getInp(w[0],nc); if(el) el.classList.add('hl'); }
                return;
            }
        }
    }
    if(dir==='v'){
        for(i=0;i<vRanges.length;i++){
            w=vRanges[i];
            if(w[0]===c && r>=w[1] && r<=w[2]){
                for(var nr=w[1];nr<=w[2];nr++){ var el2=getInp(nr,w[0]); if(el2) el2.classList.add('hl'); }
                return;
            }
        }
    }
}

function nextCell(r,c){
    if(dir==='h'){ for(var nc=c+1;nc<COLS;nc++) if(has(r,nc)) return getInp(r,nc); }
    else { for(var nr=r+1;nr<ROWS;nr++) if(has(nr,c)) return getInp(nr,c); }
    return null;
}
function prevCell(r,c){
    if(dir==='h'){ for(var nc=c-1;nc>=0;nc--) if(has(r,nc)) return getInp(r,nc); }
    else { for(var nr=r-1;nr>=0;nr--) if(has(nr,c)) return getInp(nr,c); }
    return null;
}

var g=document.getElementById('grid');
for(var r=0;r<ROWS;r++){
    for(var c=0;c<COLS;c++){
        var cell=document.createElement('div');
        cell.className='cell';
        var key=r+'-'+c;
        if(!(key in answers)){
            cell.classList.add('black');
        }else{
            var ans=answers[key];
            var inp=document.createElement('input');
            inp.type='text';
            inp.maxLength=ans.length;
            inp.dataset.row=r; inp.dataset.col=c;
            if(ans.length>1) inp.classList.add('digraph');
            if(keyCells.has(key)) inp.classList.add('key-cell');
            if(nums[key]){
                nums[key].forEach(function(b){
                    var badge=document.createElement('div');
                    badge.className='num-badge';
                    badge.textContent=b.n;
                    badge.style.background=b.c;
                    cell.appendChild(badge);
                });
            }
            inp.addEventListener('mousedown',(function(inp){
                return function(){
                    var r2=+inp.dataset.row, c2=+inp.dataset.col;
                    var k=r2+'-'+c2;
                    if(focusedCell===inp && hSet.has(k) && vSet.has(k)){
                        dir=(dir==='h'?'v':'h');
                        highlightWord(r2,c2);
                    }else{
                        dir=autoDir(r2,c2);
                    }
                };
            })(inp));
            inp.addEventListener('focus',(function(inp){
                return function(){
                    focusedCell=inp;
                    highlightWord(+inp.dataset.row,+inp.dataset.col);
                };
            })(inp));
            inp.addEventListener('input',(function(inp){
                return function(){
                    inp.value=inp.value.toUpperCase();
                    if(inp.value.length>=inp.maxLength){
                        var r2=+inp.dataset.row, c2=+inp.dataset.col;
                        var nx=nextCell(r2,c2);
                        if(nx) nx.focus();
                    }
                };
            })(inp));
            inp.addEventListener('keydown',(function(inp){
                return function(e){
                    var r2=+inp.dataset.row, c2=+inp.dataset.col;
                    if(e.key==='Backspace'&&!inp.value){
                        e.preventDefault();
                        var pv=prevCell(r2,c2);
                        if(pv) pv.focus();
                    }
                    if(e.key==='ArrowRight'){ e.preventDefault(); dir='h'; var nx=nextCell(r2,c2); if(nx) nx.focus(); else highlightWord(r2,c2); }
                    if(e.key==='ArrowLeft'){ e.preventDefault(); dir='h'; var pv2=prevCell(r2,c2); if(pv2) pv2.focus(); else highlightWord(r2,c2); }
                    if(e.key==='ArrowDown'){ e.preventDefault(); dir='v'; if(has(r2+1,c2)){ getInp(r2+1,c2).focus(); } else highlightWord(r2,c2); }
                    if(e.key==='ArrowUp'){ e.preventDefault(); dir='v'; if(has(r2-1,c2)){ getInp(r2-1,c2).focus(); } else highlightWord(r2,c2); }
                };
            })(inp));
            cell.appendChild(inp);
        }
        g.appendChild(cell);
    }
}

// MURAKKAB BUKLASH kalit so'zini oldindan to'ldirish (col 4)
var prefillCells={'0-4':'M','1-4':'U','2-4':'R','3-4':'A','4-4':'K','5-4':'K','6-4':'A','7-4':'B','9-4':'B','10-4':'U','11-4':'K','12-4':'L','13-4':'A','14-4':'SH'};
Object.keys(prefillCells).forEach(function(k){
    var parts=k.split('-');
    var inp=getInp(+parts[0],+parts[1]);
    if(inp){ inp.value=prefillCells[k]; inp.disabled=true; inp.classList.add('prefilled'); }
});

function checkAnswers(){
    var inputs=document.querySelectorAll('.cell input');
    var total=0,correct=0;
    inputs.forEach(function(inp){
        if(inp.classList.contains('prefilled')) return;
        total++;
        var key=inp.dataset.row+'-'+inp.dataset.col;
        var ok=inp.value.toUpperCase()===answers[key];
        inp.classList.remove('correct','incorrect','hl');
        inp.classList.add(ok?'correct':'incorrect');
        if(ok) correct++;
        inp.disabled=true;
    });
    var res=document.getElementById('result');
    if(correct===total){
        res.textContent="Barakalla! Krossvord to'liq to'g'ri yechildi! Kalit so'z: MURAKKAB BUKLASH";
        res.className='result-msg success';
    }else{
        res.textContent=correct+' / '+total+" ta harf to'g'ri. Qayta urinib ko'ring!";
        res.className='result-msg fail';
    }
    document.getElementById('check-btn').style.display='none';
    document.getElementById('retry-btn').style.display='inline-block';
}

function retry(){
    document.querySelectorAll('.cell input').forEach(function(inp){
        if(inp.classList.contains('prefilled')) return;
        inp.value='';inp.disabled=false;
        inp.classList.remove('correct','incorrect','hl');
    });
    document.getElementById('result').textContent='';
    document.getElementById('result').className='result-msg';
    document.getElementById('check-btn').style.display='inline-block';
    document.getElementById('retry-btn').style.display='none';
    focusedCell=null;
}

document.getElementById('clues-h').innerHTML=
'<div class="clue-item"><b>7.</b> Origami ishqibozlari nima deb atalgan?</div>'+
'<div class="clue-item"><b>8.</b> Origami qaysi tildan olingan?</div>'+
'<div class="clue-item"><b>9.</b> Qog\'ozni bir necha marta buklab shakl berish jarayoni.</div>'+
'<div class="clue-item"><b>10.</b> Qog\'oz shakllarini yig\'ishning qadimiy san\'ati.</div>'+
'<div class="clue-item"><b>11.</b> Modulli origami eng keng tarqalgan ob\'ektlardan biri ... uch o\'lchamli sharsimon jismdir.</div>'+
'<div class="clue-item"><b>12.</b> Texnikaning o\'ziga xosligi shundaki, ish jarayonida faqat qatlamali "tog\'" va ... uslubi ishlatiladi.</div>'+
'<div class="clue-item"><b>15.</b> Buklash qobiliyati uzoq ... davrda paydo bo\'ldi.</div>';

document.getElementById('clues-v').innerHTML=
'<div class="clue-item"><b>1.</b> Origami birinchi bo\'lib qayerda paydo bo\'lgan?</div>'+
'<div class="clue-item"><b>2.</b> Bitta qog\'ozdan buklanadigan origami turi.</div>'+
'<div class="clue-item"><b>3.</b> Origamining eng qadimiy uslubi.</div>'+
'<div class="clue-item"><b>4.</b> 20-asrning o\'rtalarida mashhur yapon origami ustasi.</div>'+
'<div class="clue-item"><b>5.</b> Origami san\'at turi qo\'lda epchillikni, ... tasavvurni va ijodiy fikrlashni rivojlantiradi.</div>'+
'<div class="clue-item"><b>6.</b> Bir nechta bir xil qismlardan yig\'iladigan origami turi.</div>';

document.getElementById('retry-btn').style.display='none';
</script>
</body>
</html>
