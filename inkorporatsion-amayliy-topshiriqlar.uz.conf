# nginx — «Inkorporatsion amaliy topshiriqlar». Serverda bir marta:
#
#   sudo cp inkorporatsion-amayliy-topshiriqlar.uz.conf /etc/nginx/sites-available/inkorporatsion-amayliy-topshiriqlar.uz
#   sudo ln -s /etc/nginx/sites-available/inkorporatsion-amayliy-topshiriqlar.uz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d inkorporatsion-amayliy-topshiriqlar.uz -d www.inkorporatsion-amayliy-topshiriqlar.uz
#
# HTTPS qismini (443, sertifikat, http → https) certbot shu faylga o'zi yozadi.
# Statik va media'ni sayt o'zi (WhiteNoise) beradi — bu yerda faqat proksi.
server {
    listen 80;
    listen [::]:80;
    server_name inkorporatsion-amayliy-topshiriqlar.uz www.inkorporatsion-amayliy-topshiriqlar.uz;

    # Admin paneldan katta PDF va video yuklash uchun.
    client_max_body_size 100M;

    location / {
        # `localhost` emas: u ::1 ga ham ochilishi mumkin, konteyner porti esa
        # faqat 127.0.0.1 da (run.sh) — nginx so'rovlarning bir qismini ::1 ga
        # urib, xato yozib, keyin qayta urinardi.
        proxy_pass http://127.0.0.1:2026;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Shusiz Django HTTPS ekanini bilmaydi (.env, 1-bo'lim).
        proxy_set_header X-Forwarded-Proto $scheme;

        # Katta fayl yuklash va sekin internetda video uzatish uzilmasin.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
